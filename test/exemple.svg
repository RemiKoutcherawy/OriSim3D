<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
<!--<svg xmlns="http://www.w3.org/2000/svg" viewBox="-220 -220 440 440">-->
    <style>
        .base-square { fill: #79baff; stroke: #000; stroke-width: 1; }
        .fold { fill: #b4b400; stroke: #000; stroke-width: 1; }
        .bg { fill: #FFF; }
    </style>

    <!-- Fond -->
    <rect width="400" height="400" class="bg" />

    <!-- Étape 1 : Le carré de base fixe (moitié inférieure gauche qui ne bouge pas) -->
    <polygon points="100,100 100,300 300,300" class="base-square" />

    <!-- Étape 2 : Le premier pliage (le coin supérieur droit se rabat vers le bas) -->
    <polygon points="100,100 300,100 300,300" class="fold">
        <animate
                attributeName="points"
                dur="6s"
                repeatCount="indefinite"
                values="100,100 300,100 300,300;
              100,100 100,300 300,300;
              100,100 100,300 300,300;
              100,100 300,100 300,300"
                keyTimes="0; 0.3; 0.8; 1" />
    </polygon>
</svg>
