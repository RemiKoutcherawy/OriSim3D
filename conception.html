<!DOCTYPE html>
<html lang="fr">
<head>
  <title>Conception</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <meta charset="utf-8">
  <!-- sonar-disable-next-line -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" >
  <style>
    :root { --split: 80%; }
    #canvas2d { position: absolute; width: 50%; height: var(--split); left: 0; top: 0; border: 1px solid black;}
    #canvas3d { position: absolute; width: 50%; height: var(--split); left: 50%; top: 0; color: hsl(210 100% 50%);border: 1px solid black}
    #overlay  { position: absolute; width: 50%; height: var(--split); left: 50%; top: 0; z-index: 1; color: hsl(60, 100%, 50%);}
    #commandArea  { position: absolute; width: 100%; height: calc(100% - var(--split)); left: 0; bottom:0; border-top: 4px solid #888;}

    #burger{position:absolute;top:8px;left:8px;z-index:10;cursor:pointer;padding:8px;background:rgba(0,0,0,.65);border-radius:4px;line-height:0;border:none;outline:none}
    #burger span{display:block;width:22px;height:2px;background:#fff;margin:4px 0}
    #nav{position:absolute;top:46px;left:8px;z-index:10;background:rgba(0,0,0,.82);border-radius:4px;display:none}
    #nav button,summary{display:block;color:#fff;padding:10px 16px;cursor:pointer;white-space:nowrap;text-decoration:none;outline:0;background:none;border:none;width:100%;text-align:left;font-family:inherit;font-size:inherit}
    #nav button:hover,summary:hover{background:rgba(255,255,255,.12)}
    #carousel{position:fixed;left:0;bottom:0;width:100%;height:90px;background:rgba(0,0,0,.82);display:flex;overflow-x:auto;gap:4px;padding:4px;box-sizing:border-box;z-index:5}
    #carousel img{height:100%;cursor:pointer;border:2px solid transparent;flex:none}
    #carousel img:hover{border-color:#fff}
  </style>
</head>
<body>
<div>
  <canvas id="canvas2d"></canvas>
  <canvas id="canvas3d"></canvas>
  <canvas id="overlay"></canvas>
</div>
<label for="commandArea">Commandes</label>
<textarea id="commandArea">d 200 200</textarea>
<script>
  (function () {
    const area = document.getElementById('commandArea');
    const GRAB = 8;
    let dragging = false;
    // Curseur de redimensionnement sur le bord supérieur
    area.addEventListener('mousemove', function (e) {
      const onEdge = e.clientY - area.getBoundingClientRect().top <= GRAB;
      area.style.cursor = (onEdge || dragging) ? 'row-resize' : '';
    });
    area.addEventListener('mousedown', function (e) {
      if (e.clientY - area.getBoundingClientRect().top <= GRAB) {
        dragging = true;
        e.preventDefault();
      }
    });
    document.addEventListener('mousemove', function (e) {
      if (!dragging) return;
      let pct = (e.clientY / window.innerHeight) * 100;
      pct = Math.max(10, Math.min(90, pct));
      document.documentElement.style.setProperty('--split', pct + '%');
    });
    document.addEventListener('mouseup', function () { dragging = false; });
  })();
</script>

<button id="burger" onclick="const n=document.getElementById('nav');n.style.display=n.style.display==='block'?'none':'block'"
        aria-label="Menu" aria-expanded="false">
  <span></span><span></span><span></span>
</button>
<div id="nav">
  <button type="button" data-load="test">Test</button>
  <button type="button" data-load="model">Model</button>
</div>
<div id="carousel"></div>
<!-- Main program -->
<script type="module">
  import {Model} from "./js/Model.js";
  import {View2d} from "./js/View2d.js";
  import {View3d} from "./js/View3d.js";
  import {Command} from "./js/Command.js";
  import {Helper} from './js/Helper.js';
  import {CommandArea} from './js/CommandArea.js';
  init();
  function init() {
    // Model 3D
    const model = new Model().init(200, 200);

    // View 3d
    const canvas3d = document.getElementById("canvas3d");
    const overlay = document.getElementById("overlay");
    const view3d = new View3d(model, canvas3d, overlay);
    view3d.initBuffers();
    view3d.initPerspective();

    // View 2d
    const canvas2d = document.getElementById("canvas2d");
    const view2d = new View2d(model, canvas2d);

    // Command
    const command = new Command(model, view3d);
    let commandArea = new CommandArea(command, document.getElementById('commandArea'));
    // Helper
    const helper = new Helper(model, command, canvas2d, view3d, overlay, commandArea);
    helper.out();

    // Offscreen model used only to render carousel thumbnails
    const thumbCanvas3d = createHiddenCanvas(240, 160);
    const thumbOverlay = createHiddenCanvas(240, 160);
    const thumbModel = new Model().init(200, 200);
    const thumbView3d = new View3d(thumbModel, thumbCanvas3d, thumbOverlay);
    const thumbCommand = new Command(thumbModel, thumbView3d);
    function createHiddenCanvas(width, height) {
      const canvas = document.createElement('canvas');
      canvas.style.cssText = `position:absolute;left:-9999px;width:${width}px;height:${height}px`;
      document.body.appendChild(canvas);
      return canvas;
    }
    function stepBoundaries(tokens) {
      const bounds = [];
      for (let i = 0; i < tokens.length; i++) {
        if (tokens[i] === '\n') bounds.push(i + 1);
      }
      if (bounds.length === 0 || bounds[bounds.length - 1] !== tokens.length) {
        bounds.push(tokens.length);
      }
      return bounds;
    }
    function buildCarousel(commandText) {
      thumbCommand.command(commandText);
      const bounds = stepBoundaries(thumbCommand.tokenTodo);
      const carousel = document.getElementById('carousel');
      carousel.innerHTML = '';
      for (const bound of bounds) {
        thumbCommand.runInstant(bound);
        thumbView3d.initBuffers();
        thumbView3d.initModelView();
        thumbView3d.render();
        const img = document.createElement('img');
        img.src = thumbCanvas3d.toDataURL('image/png');
        img.alt = 'étape';
        img.addEventListener('click', () => jumpToStep(commandText, bound));
        img.addEventListener('dblclick', () => run());
        carousel.appendChild(img);
      }
    }
    function jumpToStep(commandText, bound) {
      command.command(commandText);
      command.runInstant(bound);
      view3d.initBuffers();
      view3d.initModelView();
    }
    function run() {
      command.command('run');
    }
    // Animation loop
    function loop() {
      if (command.anim()) {
        view3d.initBuffers();
        view3d.initModelView();
      }
      view2d.drawModel();
      view3d.render();
      helper.draw();
      requestAnimationFrame(loop);
    }
    loop();

    // Read tag and launch
    const commandText = document.getElementById("crimp").content.textContent;
    globalThis.addEventListener("load", () => {
      command.command(commandText);
      buildCarousel(commandText);
    });

    // Add button actions
    document.querySelectorAll('button[data-load]').forEach(btn => {
      // Le lien entre data-load et dataset.load est une conversion automatique
      btn.addEventListener('click', () => load(btn.dataset.load))
    })

    function load(id) {
      const nav = document.getElementById('nav');
      nav.style.display = 'none';
      document.getElementById('burger').setAttribute('aria-expanded', 'false');
      const text = document.getElementById(id).content.textContent;
      command.command(text);
      buildCarousel(text);
    }
  }

</script>
<!-- Inline models -->
<template id="test">
  // test
  d 200 200
  overlay labels lines
</template>
<template id="model">
  // Austria
  d 200 200
  snap overlay labels
  by3d p0 p2
  o -1 f0
  t 100 r s4 -180 p3
  across3d p0 p1
  ss s9
  t 100 r s7 -180 p0
  t 100 r s7 180 p0
  ss s9
  across3d p0 p5
  ss s14
  t 100 r s12 -180 p0
  t 100 r s12 180 p0
  ss s14
  across3d p0 p8
  ss s19
  t 100 r s17 -180 p0
  t 100 r s17 180 p0
  ss s19
  p3d s1 p10
  ss s23 s27 s31
  t 100 r s29 -180 p0 p1 p3 p5 p6 p8 p9 p11 p12
  t 100 r s29 180 p0 p1 p3 p5 p6 p8 p9 p11 p12
  t 100 r s4 180 p3 p6 p9 p12 p13 p15 p17
  by3d p9 p8
  o 0
  o 1 f0 f1 f14 f15
  t 100 r s33 -180 p0 p11 p12
  o -1 f2 f4 f6 f15
  t 100 r s31 -180 p1 p5 p8
  o -1 f3 f5 f7 f14

<template id="crimp">
  overlay labels snap
  by2d p1 p3
  t 100 r s4 180 p2
  split s4 0.50 // p4
  split s0 0.6 // p5 p6
  by3d p5 p4   // s7 s9
  // Crimp p5 p4 p6 p1
  t 100 r s5 -10 p6
  t 100 r s9 180 p1
  t 100 r s5 -10 p6 a p6
  // a p6 // Should not be necessary
  check

</body>
</html>
