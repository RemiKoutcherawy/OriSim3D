<!DOCTYPE html>
<html lang="fr">
<head>
  <title>Conception</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <meta charset="utf-8">
  <!-- sonar-disable-next-line -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" >
  <style>
    :root { --split: 80%; }
    #canvas2d { position: absolute; width: 50%; height: var(--split); left: 0; top: 0; border: 1px solid black;}
    #canvas3d { position: absolute; width: 50%; height: var(--split); left: 50%; top: 0; color: hsl(210 100% 50%);border: 1px solid black}
    #overlay  { position: absolute; width: 50%; height: var(--split); left: 50%; top: 0; z-index: 1; color: hsl(60, 100%, 50%);}
    #commandArea  { position: absolute; width: 100%; height: calc(100% - var(--split)); left: 0; bottom:0; border-top: 4px solid #888;}

    #burger{position:absolute;top:8px;left:8px;z-index:10;cursor:pointer;padding:8px;background:rgba(0,0,0,.65);border-radius:4px;line-height:0;border:none;outline:none}
    #burger span{display:block;width:22px;height:2px;background:#fff;margin:4px 0}
    #nav{position:absolute;top:46px;left:8px;z-index:10;background:rgba(0,0,0,.82);border-radius:4px;display:none}
    #nav button,summary{display:block;color:#fff;padding:10px 16px;cursor:pointer;white-space:nowrap;text-decoration:none;outline:0;background:none;border:none;width:100%;text-align:left;font-family:inherit;font-size:inherit}
    #nav button:hover,summary:hover{background:rgba(255,255,255,.12)}
  </style>
</head>
<body>
<div>
  <canvas id="canvas2d"></canvas>
  <canvas id="canvas3d"></canvas>
  <canvas id="overlay"></canvas>
</div>
<label for="commandArea">Commandes</label>
<textarea id="commandArea">d 200 200</textarea>
<script>
  (function () {
    const area = document.getElementById('commandArea');
    const GRAB = 8;
    let dragging = false;
    // Curseur de redimensionnement sur le bord supérieur
    area.addEventListener('mousemove', function (e) {
      const onEdge = e.clientY - area.getBoundingClientRect().top <= GRAB;
      area.style.cursor = (onEdge || dragging) ? 'row-resize' : '';
    });
    area.addEventListener('mousedown', function (e) {
      if (e.clientY - area.getBoundingClientRect().top <= GRAB) {
        dragging = true;
        e.preventDefault();
      }
    });
    document.addEventListener('mousemove', function (e) {
      if (!dragging) return;
      let pct = (e.clientY / window.innerHeight) * 100;
      pct = Math.max(10, Math.min(90, pct));
      document.documentElement.style.setProperty('--split', pct + '%');
    });
    document.addEventListener('mouseup', function () { dragging = false; });
  })();
</script>

<button id="burger" onclick="const n=document.getElementById('nav');n.style.display=n.style.display==='block'?'none':'block'"
        aria-label="Menu" aria-expanded="false">
  <span></span><span></span><span></span>
</button>
<div id="nav">
  <button type="button" data-load="test">Test</button>
  <button type="button" data-load="boat">Bateau</button>
</div>
<!-- Main program -->
<script type="module">
  import {Model} from "./js/Model.js";
  import {View2d} from "./js/View2d.js";
  import {View3d} from "./js/View3d.js";
  import {Command} from "./js/Command.js";
  import {Helper} from './js/Helper.js';
  import {CommandArea} from './js/CommandArea.js';
  init();
  function init() {
    // Model 3D
    const model = new Model().init(200, 200);

    // View 3d
    const canvas3d = document.getElementById("canvas3d");
    const overlay = document.getElementById("overlay");
    const view3d = new View3d(model, canvas3d, overlay);
    view3d.initBuffers();
    view3d.initPerspective();

    // View 2d
    const canvas2d = document.getElementById("canvas2d");
    const view2d = new View2d(model, canvas2d);

    // Command
    const command = new Command(model, view3d);
    let commandArea = new CommandArea(command, document.getElementById('commandArea'));
    // Helper
    const helper = new Helper(model, command, canvas2d, view3d, overlay, commandArea);
    helper.out();
    // Animation loop
    function loop() {
      if (command.anim()) {
        view3d.initBuffers();
        view3d.initModelView();
      }
      view2d.drawModel();
      view3d.render();
      helper.draw();
      requestAnimationFrame(loop);
    }
    loop();

    // Read tag and launch
    const commandText = document.getElementById("boat").content.textContent;
    globalThis.addEventListener("load", () => { command.command(commandText) });
    // Add button actions
    document.querySelectorAll('button[data-load]').forEach(btn => {
      // Le lien entre data-load et dataset.load est une conversion automatique
      btn.addEventListener('click', () => load(btn.dataset.load))
    })
    function load(id) {
      const nav = document.getElementById('nav');
      nav.style.display = 'none';
      document.getElementById('burger').setAttribute('aria-expanded', 'false');
      command.command(document.getElementById(id).content.textContent);
    }
  }

</script>
<!-- Inline models -->
<template id="test">
  // test
  d 200 200
  overlay labels
  c2d p0 p1 c2d p0 p3 c2d p0 p2 c2d p1 p3
  o -1 f0 f1 f5 f7
  t 500 r s9 -180 p2 p3 p5
  t 200 r s8 -90 p3 a p6
  t 200 r s8 -90 p3 a p6
  t 500 r s8 180 p3
  t 500 r s8 180 p2 a p8
  t 500 r s8 -180 p2
</template>
<template id="boat">
  // boat
  d 200 200
  snap overlay labels
  across2d p0 p3
  o -1 f0
  t 100 r s6 -180 p2 p3
  fit
  across2d p0 p1
  by3d p0 p6 by3d p1 p6
  o -2 f2 f3 o -2 f6 f7
  t 100 r s12 180 p4  r s14 180 p5
  // Open
  o -1 f1
  t 100 r s13 120 p4 p5 p8 r s9 -100 p1 p2
  t 100 r s13 60 p4 p5 p8 r s9 -80 p1 p2
  fit
  by3d p4 p7
  t 100 r s21 180 p1 p2
  t 100 r s21 -180 p0 p3
  check
</template>
</body>
</html>
