<!DOCTYPE html>
<html lang="fr">
<head>
  <title>Origami</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <meta charset="utf-8">
  <!-- sonar-disable-next-line -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root { --split: 100%; }
    /* noinspection CssUnusedSymbol -- class toggled dynamically as `${btn.dataset.ui}-open` */
    body.command-area-open { --split: 80%; }
    /* noinspection CssUnusedSymbol -- #overlay is a canvas created at runtime by View3d.js */
    #canvas3d,#overlay{position:absolute;top:0;left:0;width:100%;height:var(--split)}
    #canvas3d{border:1px solid black}
    #overlay{z-index:1}
    #canvas2d{display:none;position:absolute;top:0;left:0;width:50%;height:var(--split);border:1px solid black}
    body.view2d-open #canvas2d{display:block}
    body.view2d-open #canvas3d,body.view2d-open #overlay{left:50%;width:50%}
    #commandAreaPanel{
      display:none;position:absolute;width:100%;left:0;bottom:0;
      height:calc(100% - var(--split));box-sizing:border-box;
      padding:4px 8px;background:#f6f8fa;border-top:1px solid black;
      flex-direction:column;z-index:5
    }
    body.command-area-open #commandAreaPanel{display:flex}
    #commandAreaPanel label{font:14px sans-serif;margin-bottom:4px}
    #commandArea{flex:1;width:100%;font:14px monospace;resize:none}
    #burger,#nav,#undoBtn,#runBtn,#stepBtn{position:absolute;left:8px;z-index:10;background:#f6f8fa;border:1px solid black;border-radius:6px}
    #burger{top:8px;padding:8px;line-height:0;cursor:pointer}
    #burger:hover{background:#eef1f4}
    #undoBtn{top:8px;left:54px;padding:8px;line-height:0;cursor:pointer}
    #undoBtn:hover{background:#eef1f4}
    #runBtn{top:8px;left:100px;padding:8px;line-height:0;cursor:pointer}
    #runBtn:hover{background:#eef1f4}
    #stepBtn{display:none;top:8px;left:146px;padding:8px;line-height:0;cursor:pointer}
    #stepBtn:hover{background:#eef1f4}
    /* noinspection CssUnusedSymbol -- toggled via classList.toggle('active', ...) */
    #stepBtn.active,#runBtn.active{background:#e6a817}
    #burger span{display:block;width:22px;height:2px;margin:4px 0;background:#1f2328;transition:.15s}
    #burger[aria-expanded="true"] span:first-child{transform:translateY(6px) rotate(45deg)}
    #burger[aria-expanded="true"] span:nth-child(2){opacity:0}
    #burger[aria-expanded="true"] span:last-child{transform:translateY(-6px) rotate(-45deg)}
    #nav{top:46px;display:none;min-width:180px;overflow:hidden}
    #nav button,#nav summary{display:block;width:100%;box-sizing:border-box;padding:10px 16px;color:#1f2328;background:none;border:0;font:inherit;text-align:left;white-space:nowrap;cursor:pointer}
    #nav button:hover,#nav summary:hover,#nav details[open]>summary{background:#eaedf0}
    #nav summary{list-style:none}
    #nav summary::-webkit-details-marker{display:none}
    #nav .chev{float:right;transition:transform .15s}
    #nav details[open] .chev{transform:rotate(90deg)}
    #nav details button{padding-left:32px;opacity:.85}
    #nav details details summary{padding-left:32px;opacity:.85}
    #nav details details button{padding-left:48px}
    #nav button[data-flag]::before,#nav button[data-ui]::before{content:"✓ ";opacity:0}
    #nav button[data-flag][data-checked="true"]::before,#nav button[data-ui][data-checked="true"]::before{opacity:1}
  </style>
</head>

<body>
<div>
  <canvas id="canvas2d"></canvas>
  <canvas id="canvas3d"></canvas>
</div>
<div id="commandAreaPanel">
  <label for="commandArea">Commandes</label>
  <textarea id="commandArea" spellcheck="false">d 200 200
</textarea>
</div>
<button id="burger" aria-label="Menu" aria-expanded="false">
  <span></span><span></span><span></span>
</button>
<button id="undoBtn" data-load="undo" aria-label="Undo">
  <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#1f2328" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 1 1 0 11H11"/></svg>
</button>
<button id="runBtn" data-load="run" aria-label="Run" title="Run: resumes normal auto-play after Step has paused the script.">
  <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#1f2328" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4l14 8-14 8z"/></svg>
</button>
<button id="stepBtn" aria-label="Step" title="Step: pauses the script, then advances one line per click. Click Run to resume.">
  <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#1f2328" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4v16l10-8z"/><line x1="18" y1="4" x2="18" y2="20"/></svg>
</button>
<nav id="nav">
  <details name="nav-menu">
    <summary>Plis de base<span class="chev">›</span></summary>
    <button type="button" data-load="demo">Tous les plis de base</button>
    <button type="button" data-load="squash-fold">Squash fold</button>
    <button type="button" data-load="rabbit-ear-fold">Rabbit-ear fold</button>
    <button type="button" data-load="reverse-fold">Reverse fold</button>
    <button type="button" data-load="square-base">Square base</button>
    <button type="button" data-load="triangle-base">Triangle base</button>
    <button type="button" data-load="petal-fold">Petal fold</button>
  </details>

  <details name="nav-menu">
    <summary>Exemples<span class="chev">›</span></summary>
    <button type="button" data-load="cocotte">Cocotte</button>
    <button type="button" data-load="plane">Plane</button>
    <button type="button" data-load="test">Test</button>
  </details>

  <details name="nav-menu">
    <summary>Édition<span class="chev">›</span></summary>
    <button type="button" data-ui="view2d">Vue 2D</button>
    <button type="button" data-ui="command-area">Console</button>
    <button type="button" data-load="labels" data-flag="labels">Labels</button>
    <button type="button" data-load="textures" data-flag="textures">Textures</button>
  </details>
  <details name="nav-menu">
    <summary>Fichier<span class="chev">›</span></summary>
    <button type="button" data-load="open">Ouvrir…</button>
    <details>
      <summary>Exporter<span class="chev">›</span></summary>
      <button type="button" data-load="exportInstructions">Exporter instruction</button>
      <button type="button" data-load="exportSvg">Exporter SVG</button>
      <button type="button" data-load="exportDiagrams">Exporter diagrammes (SVG)</button>
      <button type="button" data-load="exportFold">Exporter FOLD</button>
    </details>
  </details>
</nav>

<!-- Inlined textures -->
<img id="front" src="textures/front.jpg" style="display:none;" alt="front"/>
<img id="back" src="textures/back.jpg" style="display:none;" alt="back"/>

<!-- Main program -->
<script type="module">
  import {Model, State} from "./js/Model.js";
  import {View2d} from "./js/View2d.js";
  import {View3d} from "./js/View3d.js";
  import {Command} from "./js/Command.js";
  import {Helper} from './js/Helper.js';
  import {CommandArea} from './js/CommandArea.js';
  init();
  function init() {
    // Model 3D
    const model = new Model().init(200, 200);

    // View 3d
    const canvas3d = document.getElementById("canvas3d");
    const view3d = new View3d(model, canvas3d);
    view3d.initBuffers();
    view3d.initPerspective();

    // View 2d (hidden by default, shown from the menu)
    const canvas2d = document.getElementById("canvas2d");
    const view2d = new View2d(model, canvas2d);

    // Command
    const command = new Command(model, view3d);
    new CommandArea(command, document.getElementById('commandArea'));
    // Helper
    const helper = new Helper(model, command, view3d, view2d);
    helper.out();

    function resizeViews() {
      view3d.initPerspective();
      view3d.initModelView();
      view3d.render();
      if (document.body.classList.contains('view2d-open')) {
        view2d.fit();
        view2d.drawModel();
      }
    }

    // Animation loop
    function loop() {
      if (command.anim()) {
        view3d.initBuffers();
        view3d.initModelView();
      }
      if (document.body.classList.contains('view2d-open')) {
        view2d.drawModel();
      }
      view3d.render();
      helper.draw();
      document.getElementById('stepBtn').classList.toggle('active', command.stepMode);
      document.getElementById('runBtn').classList.toggle('active', model.state === State.pause);
      requestAnimationFrame(loop);
    }
    loop();

    // Step-by-step debug: first click arms step mode;
    // each further click advances one script line.
    // Type "run" to resume normal play.
    document.getElementById('stepBtn').addEventListener('click', () => {
      command.stepMode = true;
      if (command.stepLine()) {
        view3d.initBuffers();
        view3d.initModelView();
      }
    });

    // Add button actions
    document.querySelectorAll('button[data-load]').forEach(btn => {
      // Le lien entre data-load et dataset.load est une conversion automatique
      btn.addEventListener('click', () => load(btn.dataset.load))
    })

    // UI-only toggles (not model flags): body gets a "<data-ui>-open" class
    document.querySelectorAll('#nav button[data-ui]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.body.classList.toggle(`${btn.dataset.ui}-open`);
        syncToggles();
        resizeViews();
        document.getElementById('nav').style.display = 'none';
        document.getElementById('burger').setAttribute('aria-expanded', 'false');
      });
    });

    // Burger toggle: open/close nav, refresh checkmarks when opening
    document.getElementById('burger').addEventListener('click', () => {
      const nav = document.getElementById('nav');
      const open = nav.style.display !== 'block';
      if (open) syncToggles();
      nav.style.display = open ? 'block' : 'none';
      document.getElementById('burger').setAttribute('aria-expanded', String(open));
    });

    // Close menu when clicking outside
    document.addEventListener('click', (e) => {
      if (!e.target.closest('#burger') && !e.target.closest('#nav')) {
        document.getElementById('nav').style.display = 'none';
        document.getElementById('burger').setAttribute('aria-expanded', 'false');
      }
    });

    // Reflect model boolean state, and UI-only open/closed state, as a checkmark on toggle buttons
    function syncToggles() {
      document.querySelectorAll('#nav button[data-flag]').forEach(btn => {
        btn.dataset.checked = model[btn.dataset.flag] ? 'true' : 'false';
      });
      document.querySelectorAll('#nav button[data-ui]').forEach(btn => {
        btn.dataset.checked = document.body.classList.contains(`${btn.dataset.ui}-open`) ? 'true' : 'false';
      });
    }

    async function load(id) {
      const nav = document.getElementById('nav');
      nav.style.display = 'none';
      document.getElementById('burger').setAttribute('aria-expanded', 'false');
      const inline = document.getElementById(id);
      let text;
      if (inline instanceof HTMLTemplateElement) {
        text = inline.content.textContent;
      } else {
        let res = await fetch(`templates/${id}.txt`);
        if (!res.ok) res = await fetch(`models/${id}.txt`);
        if (!res.ok) {
          console.error('Template not found:', id);
          return;
        }
        text = await res.text();
      }
      command.command(text);
      syncToggles();
    }


    // Chargement du template "test" au lancement
    load('demo');

  }

</script>
<!-- Inline commands -->
<template id="open">read</template>
<template id="exportInstructions">instructions</template>
<template id="exportSvg">svg</template>
<template id="exportFold">fold</template>

<!-- Inline models -->
<template id="test">
  // Triangle base
  d 200 200
  by2d p0 p2 by2d p1 p3
  c2d p0 p1 c2d p1 p2
  t 1000 r s5 -180 p8 r s6 180 p7 a p2 p3 p5
  t 1000 fit
  t 1000 r s11 90 p2 r s11 -90 p3 a p5
  check
</template>
<template id="demo">
  // Squash fold — open a pocket and flatten it
  d 200 200
  t 100 tx -30
  c2d p1 p2
  o -1 f0
  c2d p0 p1
  t 500 r s6 -180 p3 p8 p2
  c3d p0 p1
  by3d p6 p1
  o -10 f1
  t 500 fit
  t 1000 r s9 -180 p2 a p5
  pause
  // Inside and outside reverse folds
  d 200 200
  t 100 tx -30
  by2d p1 p3
  o -1 f1
  t 200 r s4 -180 p2
  split s4 0.5 sp p4
  p3d s0 p4
  b3d s7 s5
  t 500 z 0.99 move 59 43 0
  t 500 r s7 -180 p8 a p1
  t 500 r s7 180 p8 a p1
  t 500 fit
  pause
  // Rabbit-ear fold — fold a corner point up between two creases
  d 200 200
  t 100 tx -30
  by2d p0 p2 by2d p1 p3
  b2d s6 s1 b2d s7 s2
  p2d s1 p5
  t 1000 r s9 180 p6 a p2
  pause
  // Square base
  d 200 200
  by2d p0 p2 by2d p1 p3
  c2d p0 p1 c2d p1 p2
  t 500 r s11 -180 p1 r s15 -180 p3 a p5 p2 p7
  t 500 r s6 -90 p7 r s7 -90 p5 a p2
  t 500 fit
  b3d s4 s11
  t 500 r s4 -180 p11 a p7
  pause
  // Triangle base
  d 200 200
  t 100 tx -30
  by2d p0 p2 by2d p1 p3
  c2d p0 p1 c2d p1 p2
  t 1000 r s5 -180 p8 r s6 180 p7 a p2 p3 p5
  t 1000 r s11 90 p2 r s11 -90 p3 a p5
  t 1000 fit
  pause
  // Petal fold — fold both sides of a flap to the center, then flatten
  d 200 200
  by2d p0 p2 by2d p1 p3
  c2d p0 p1 c2d p1 p2
  t 200 r s11 -180 p1 r s15 -180 p3 a p5 p2 p7
  t 200 r s6 -90 p7 r s7 -90 p5 a p2
  t 200 fit
  tz 45 z 0.71
  b3d s2 s4 b3d s0 s4 by3d p9 p11
  t 200 zoom 0.75 0 0 move 0 -75 0
  // Petal fold
  t 2000 r s31 -178 p2 a p5 p7
  pause
  // Paper airplane by Vibe Mistral
  define 200 200
  textures
  // Center crease
  across2d p0 p1
  // Wing creases while the sheet is still flat
  across2d p4 p1
  across2d p4 p0
  // Fold top corners to the center
  bisector2d s2 s6
  bisector2d s11 s6
  offset -1 f0 f4 f5 f1 f3
  t 1000 r s16 180 p2 p7
  t 1000 r s20 -180 p3 p9
  // Crease the folded flaps along the future wing line
  split s15 0.5
  split s3 0.5
  by3d p10 p14
  by3d p12 p15
  // Fold in half along the center
  offset -2 f1 f3 f6 f7 f9
  t 1000 r s6 170 p0 p8 p13 p12 p3 p9 p15
  t 200 ty -45
  // Open the wings to fly
  t 300 r s9 80 p1 p11
  t 300 r s17 80 p0 p13
  // Stand the fuselage up, wings toward the camera
  t 500 tz 90
  t 500 fit
  // Show
  iao
  t 1000 z 0.5 0 0
  t 1000 fit
  iao
  t 1000 ty 360
  pause
  // Cocotte
  define 200 200
  textures
  // Define crease pattern
  c3d p0 p1 c3d p0 p3 c3d p0 p2 c3d p1 p3 c3d p0 p8 c3d p8 p3
  c3d p0 p4 c3d p4 p1 c3d p6 p0 c3d p6 p1 c3d p6 p2 c3d p6 p3
  // Movements with Accelerate Decelerate Interpolator (iad)
  iad
  t 100 ty 180
  // Fold one corner
  offset 1 f13 f14 f30 f31
  t 100 r s54 -180 p3 p17 p19
  t 100 ty 180
  // Fold from top
  t 100 rotate s27 170 p5 p22 p2
  // Lift up top right corner
  t 100 r s53 -100 p22 a p2 p7 p18
  // Fold from right
  t 100 r s45 170 p7 p12 p1 a p2 p18
  // Flatten leg
  t 100 r s53 45 p22 a p2 p18
  // Lay leg flat
  t 100 r s53 30 p22 p2 p18
  // Lift up bottom right corner
  t 100 r s50 -100 p12 a p1 p24
  // Fold from bottom
  t 100 r s23 170 p0 p21 p4 a p1 p24
  // Flatten leg
  t 100 r s51 45 p24 a p1 p12
  // Lay leg flat
  t 100 r s51 80 p12 p1 p24 a p12
  // Lift bottom left corner
  t 100 r s48 -100 p21 a p0 p9
  // Fold from left
  t 100 r s37 -170 p8 a p0 p9
  // Flatten leg
  t 100 r s48 -45 p9 a p0 p9
  // Lay leg flat
  t 100 r s48 -70 p21 p9 p0 a p9
  // Fold along median and open beak
  t 100 r s28 -180 p19 p5 p7 p22 p2 p14 p15 p18 p23 r s38 -170 p3
  // Pretty
  r s50 -5 p12 a p1
  offset // Remove offset for all faces
  // Beak
  t 100 r s54 15 p19 r s55 15 p17 a p3
  // Tail
  t 100 r s13 -10 p24 p12 p1
  a p12 p24 p1
  // Show
  t 100 tz -45
  iao
  t 1000 z 0.5 0 50
  t 1000 fit
  iao
  t 1000 ty 360
</template>

<template id="plane">
  // Paper airplane by Vibe Mistral
  define 200 200
  textures
  // Center crease
  across2d p0 p1
  // Wing creases while the sheet is still flat
  across2d p4 p1
  across2d p4 p0
  // Fold top corners to the center
  bisector2d s2 s6
  bisector2d s11 s6
  offset -1 f0 f4 f5 f1 f3
  t 1000 r s16 180 p2 p7
  t 1000 r s20 -180 p3 p9
  // Crease the folded flaps along the future wing line
  split s15 0.5
  split s3 0.5
  by3d p10 p14
  by3d p12 p15
  // Fold in half along the center
  offset -2 f1 f3 f6 f7 f9
  t 1000 r s6 170 p0 p8 p13 p12 p3 p9 p15
  t 200 ty -45
  // Open the wings to fly
  t 300 r s9 80 p1 p11
  t 300 r s17 80 p0 p13
  // Stand the fuselage up, wings toward the camera
  t 500 tz 90
  t 500 fit
  // Show
  iao
  t 1000 z 0.5 0 0
  t 1000 fit
  iao
  t 1000 ty 360
</template>

<template id="cocotte">
  // Cocotte
  define 200 200
  textures
  // Define crease pattern
  c3d p0 p1 c3d p0 p3 c3d p0 p2 c3d p1 p3 c3d p0 p8 c3d p8 p3
  c3d p0 p4 c3d p4 p1 c3d p6 p0 c3d p6 p1 c3d p6 p2 c3d p6 p3
  // Movements with Accelerate Decelerate Interpolator (iad)
  iad
  t 100 ty 180
  // Fold one corner
  offset 1 f13 f14 f30 f31
  t 100 r s54 -180 p3 p17 p19
  t 100 ty 180
  // Fold from top
  t 100 rotate s27 170 p5 p22 p2
  // Lift up top right corner
  t 100 r s53 -100 p22 a p2 p7 p18
  // Fold from right
  t 100 r s45 170 p7 p12 p1 a p2 p18
  // Flatten leg
  t 100 r s53 45 p22 a p2 p18
  // Lay leg flat
  t 100 r s53 30 p22 p2 p18
  // Lift up bottom right corner
  t 100 r s50 -100 p12 a p1 p24
  // Fold from bottom
  t 100 r s23 170 p0 p21 p4 a p1 p24
  // Flatten leg
  t 100 r s51 45 p24 a p1 p12
  // Lay leg flat
  t 100 r s51 80 p12 p1 p24 a p12
  // Lift bottom left corner
  t 100 r s48 -100 p21 a p0 p9
  // Fold from left
  t 100 r s37 -170 p8 a p0 p9
  // Flatten leg
  t 100 r s48 -45 p9 a p0 p9
  // Lay leg flat
  t 100 r s48 -70 p21 p9 p0 a p9
  // Fold along median and open beak
  t 100 r s28 -180 p19 p5 p7 p22 p2 p14 p15 p18 p23 r s38 -170 p3
  // Pretty
  r s50 -5 p12 a p1
  offset // Remove offset for all faces
  // Beak
  t 100 r s54 15 p19 r s55 15 p17 a p3
  // Tail
  t 100 r s13 -10 p24 p12 p1
  a p12 p24 p1
  // Show
  t 100 tz -45
  iao
  t 1000 z 0.5 0 50
  t 1000 fit
  iao
  t 1000 ty 360
</template>

<!-- Template pour tester le Reverse Inside Fold (bec de la grue) -->
<template id="reverse-inside-test">
  // Test du Reverse Inside Fold
  define 200 200
  // Créer une base simple avec une pliure centrale
  by2d p0 p2
  split s2 0.50 // Crée p4
  split s1 0.50 // Crée p5
  by2d p4 p5 // Crée p6
  o -1 f0 o -2 f3
  zoom 0.8
  t 1000 r s4 -180 p3 p4 // Replie la face
  t 1000 reverseInside s4 p6
</template>
