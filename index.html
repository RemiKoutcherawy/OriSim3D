<!DOCTYPE html>
<html lang="fr">
<head>
  <title>Origami</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <meta charset="utf-8">
  <!-- sonar-disable-next-line -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root { --split: 100%; --playbook-h: 0px; }
    body.command-area-open { --split: 80%; }
    body.playbook-open { --playbook-h: 44px; }
    #canvas2d,#canvas3d,#overlay{position:absolute;top:0;width:50%;height:calc(var(--split) - var(--playbook-h))}
    #canvas2d{left:0;border:1px solid black}
    #canvas3d{left:50%;border:1px solid black}
    #overlay{left:50%;z-index:1}
    #commandAreaPanel{
      display:none;position:absolute;width:100%;left:0;bottom:0;
      height:calc(100% - var(--split));box-sizing:border-box;
      padding:4px 8px;background:#f6f8fa;border-top:1px solid black;
      flex-direction:column;z-index:5
    }
    body.command-area-open #commandAreaPanel{display:flex}
    #commandAreaPanel label{font:14px sans-serif;margin-bottom:4px}
    #commandArea{flex:1;width:100%;font:14px monospace;resize:none}
    #playbookBar{
      display:none;position:absolute;left:0;right:0;bottom:0;height:var(--playbook-h);
      box-sizing:border-box;padding:6px 10px;background:#f6f8fa;border-top:1px solid black;
      z-index:6;align-items:center;gap:8px;font:13px sans-serif;color:#1f2328
    }
    body.playbook-open #playbookBar{display:flex}
    body.command-area-open.playbook-open #playbookBar{bottom:calc(100% - var(--split))}
    #playbookBar button{padding:4px 10px;border:1px solid #bbb;border-radius:4px;background:#fff;cursor:pointer;font:inherit}
    #playbookBar button:hover{background:#eef1f4}
    #playbookBar #playbookLabel{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:monospace;font-size:12px;color:#555}
    #playbookBar input[type=range]{width:120px}
    #burger,#nav,#undoBtn{position:absolute;left:8px;z-index:10;background:#f6f8fa;border:1px solid black;border-radius:6px}
    #burger{top:8px;padding:8px;line-height:0;cursor:pointer}
    #burger:hover{background:#eef1f4}
    #undoBtn{top:8px;left:54px;padding:8px;line-height:0;cursor:pointer}
    #undoBtn:hover{background:#eef1f4}
    #burger span{display:block;width:22px;height:2px;margin:4px 0;background:#1f2328;transition:.15s}
    #burger[aria-expanded="true"] span:first-child{transform:translateY(6px) rotate(45deg)}
    #burger[aria-expanded="true"] span:nth-child(2){opacity:0}
    #burger[aria-expanded="true"] span:last-child{transform:translateY(-6px) rotate(-45deg)}
    #nav{top:46px;display:none;min-width:180px;overflow:hidden}
    #nav button,#nav summary{display:block;width:100%;box-sizing:border-box;padding:10px 16px;color:#1f2328;background:none;border:0;font:inherit;text-align:left;white-space:nowrap;cursor:pointer}
    #nav button:hover,#nav summary:hover,#nav details[open]>summary{background:#eaedf0}
    #nav summary{list-style:none}
    #nav summary::-webkit-details-marker{display:none}
    #nav .chev{float:right;transition:transform .15s}
    #nav details[open] .chev{transform:rotate(90deg)}
    #nav details button{padding-left:32px;opacity:.85}
    #nav details details summary{padding-left:32px;opacity:.85}
    #nav details details button{padding-left:48px}
    #nav button[data-flag]::before,#nav button[data-ui]::before{content:"✓ ";opacity:0}
    #nav button[data-flag][data-checked="true"]::before,#nav button[data-ui][data-checked="true"]::before{opacity:1}
  </style>
</head>
<body>
<div>
  <canvas id="canvas2d"></canvas>
  <canvas id="canvas3d"></canvas>
  <canvas id="overlay"></canvas>
</div>
<div id="commandAreaPanel">
  <label for="commandArea">Commandes</label>
  <textarea id="commandArea" spellcheck="false">d 200 200
</textarea>
</div>
<div id="playbookBar" aria-label="Playbook">
  <button type="button" id="playbookPrev" title="Étape précédente">◀</button>
  <button type="button" id="playbookNext" title="Étape suivante">▶</button>
  <span id="playbookStep">0/0</span>
  <input type="range" id="playbookSlider" min="0" max="0" value="0" aria-label="Scrub playbook"/>
  <span id="playbookLabel"></span>
  <button type="button" id="playbookReset" title="Revenir au début">Début</button>
</div>
<button id="burger" aria-label="Menu" aria-expanded="false">
  <span></span><span></span><span></span>
</button>
<button id="undoBtn" data-load="undo" aria-label="Undo">
  <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#1f2328" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 1 1 0 11H11"/></svg>
</button>
<nav id="nav">
  <details>
    <summary>Fichier<span class="chev">›</span></summary>
    <button type="button" data-load="open">Ouvrir…</button>
    <details>
      <summary>Exporter<span class="chev">›</span></summary>
      <button type="button" data-load="exportInstructions">Exporter instruction</button>
      <button type="button" data-load="exportSvg">Exporter SVG</button>
      <button type="button" data-load="exportFold">Exporter FOLD</button>
      <button type="button" data-load="exportDiagrams">Exporter diagrammes</button>
    </details>
  </details>
  <details>
    <summary>Édition<span class="chev">›</span></summary>
    <button type="button" data-load="undo">Undo</button>
    <button type="button" data-load="mvCycle">Cycle M/V (Shift+clic)</button>
    <button type="button" data-load="valley">Valley</button>
    <button type="button" data-load="mountain">Mountain</button>
    <button type="button" data-load="lines" data-flag="lines">Lines</button>
    <button type="button" data-load="edges" data-flag="edges">Edges</button>
    <button type="button" data-load="snap" data-flag="snap">Snap</button>
    <button type="button" data-load="overlayCde" data-flag="overlay">Overlay</button>
    <button type="button" data-load="labels" data-flag="labels">Labels</button>
    <button type="button" data-load="textures" data-flag="textures">Textures</button>
    <button type="button" id="toggleCommandArea" data-ui="commandArea">Console</button>
    <button type="button" id="togglePlaybook" data-ui="playbook">Playbook</button>
  </details>
  <details>
    <summary>Exemples<span class="chev">›</span></summary>
    <button type="button" data-load="cocotte">Cocotte</button>
    <button type="button" data-load="boat">Bateau</button>
    <button type="button" data-load="test">Test</button>
  </details>
</nav>

<!-- Inlined textures -->
<img id="front" src="textures/front.jpg" style="display:none;" alt="front"/>
<img id="back" src="textures/back.jpg" style="display:none;" alt="back"/>

<!-- Main program -->
<script type="module">
  import {Model} from "./js/Model.js";
  import {View2d} from "./js/View2d.js";
  import {View3d} from "./js/View3d.js";
  import {Command} from "./js/Command.js";
  import {Helper} from './js/Helper.js';
  import {CommandArea} from './js/CommandArea.js';
  init();
  function init() {
    // Model 3D
    const model = new Model().init(200, 200);

    // View 3d
    const canvas3d = document.getElementById("canvas3d");
    const overlay = document.getElementById("overlay");
    const view3d = new View3d(model, canvas3d, overlay);
    view3d.initBuffers();
    view3d.initPerspective();

    // View 2d
    const canvas2d = document.getElementById("canvas2d");
    const view2d = new View2d(model, canvas2d);

    // Command
    const command = new Command(model, view3d);
    new CommandArea(command, document.getElementById('commandArea'));
    // Helper
    const helper = new Helper(model, command, canvas2d, view3d, overlay);
    helper.out();

    function resizeViews() {
      view3d.initPerspective();
      view3d.initModelView();
      view2d.drawModel();
      view3d.render();
    }

    function setCommandAreaOpen(open) {
      document.body.classList.toggle('command-area-open', open);
      syncToggles();
      resizeViews();
    }

    function setPlaybookOpen(open) {
      document.body.classList.toggle('playbook-open', open);
      syncToggles();
      resizeViews();
    }

    function syncPlaybookUI(index, total, lastStep) {
      document.getElementById('playbookStep').textContent = `${index}/${total}`;
      const slider = document.getElementById('playbookSlider');
      slider.max = String(total);
      slider.value = String(index);
      document.getElementById('playbookLabel').textContent = lastStep || (total ? command.playbookSteps[index] || '' : '');
    }
    command.onPlaybookChange = syncPlaybookUI;

    document.getElementById('playbookPrev').addEventListener('click', () => {
      command.stepPrev();
      view3d.initBuffers();
      view3d.initModelView();
    });
    document.getElementById('playbookNext').addEventListener('click', () => {
      command.stepNext();
    });
    document.getElementById('playbookReset').addEventListener('click', () => {
      command.gotoStep(0);
      view3d.initBuffers();
      view3d.initModelView();
    });
    document.getElementById('playbookSlider').addEventListener('input', (e) => {
      command.gotoStep(Number(e.target.value));
      view3d.initBuffers();
      view3d.initModelView();
    });

    // Animation loop
    function loop() {
      if (command.anim()) {
        view3d.initBuffers();
        view3d.initModelView();
      }
      view2d.drawModel();
      view3d.render();
      helper.draw();
      requestAnimationFrame(loop);
    }
    loop();

    // Add button actions
    document.querySelectorAll('button[data-load]').forEach(btn => {
      // Le lien entre data-load et dataset.load est une conversion automatique
      btn.addEventListener('click', () => load(btn.dataset.load))
    })
    document.getElementById('toggleCommandArea').addEventListener('click', () => {
      setCommandAreaOpen(!document.body.classList.contains('command-area-open'));
      document.getElementById('nav').style.display = 'none';
      document.getElementById('burger').setAttribute('aria-expanded', 'false');
    });
    document.getElementById('togglePlaybook').addEventListener('click', () => {
      setPlaybookOpen(!document.body.classList.contains('playbook-open'));
      document.getElementById('nav').style.display = 'none';
      document.getElementById('burger').setAttribute('aria-expanded', 'false');
    });

    // Burger toggle: open/close nav, refresh checkmarks when opening
    document.getElementById('burger').addEventListener('click', () => {
      const nav = document.getElementById('nav');
      const open = nav.style.display !== 'block';
      if (open) syncToggles();
      nav.style.display = open ? 'block' : 'none';
      document.getElementById('burger').setAttribute('aria-expanded', open);
    });

    // Close menu when clicking outside
    document.addEventListener('click', (e) => {
      if (!e.target.closest('#burger') && !e.target.closest('#nav')) {
        document.getElementById('nav').style.display = 'none';
        document.getElementById('burger').setAttribute('aria-expanded', 'false');
      }
    });

    // Reflect model boolean state as a checkmark on toggle buttons
    function syncToggles() {
      document.querySelectorAll('#nav button[data-flag]').forEach(btn => {
        btn.dataset.checked = model[btn.dataset.flag] ? 'true' : 'false';
      });
      const consoleBtn = document.getElementById('toggleCommandArea');
      consoleBtn.dataset.checked = document.body.classList.contains('command-area-open') ? 'true' : 'false';
      const playbookBtn = document.getElementById('togglePlaybook');
      playbookBtn.dataset.checked = document.body.classList.contains('playbook-open') ? 'true' : 'false';
    }

    function load(id) {
      const nav = document.getElementById('nav');
      nav.style.display = 'none';
      document.getElementById('burger').setAttribute('aria-expanded', 'false');
      const text = document.getElementById(id).content.textContent;
      if (id === 'cocotte' || id === 'boat' || id === 'test') {
        command.setPlaybook(text);
        setPlaybookOpen(true);
      }
      command.command(text);
      if (command.playbookSteps.length) {
        command.playbookIndex = command.playbookSteps.length;
        command.notifyPlaybook();
      }
      syncToggles();
    }

    // Chargement du template "test" au lancement
    load('test');
  }

</script>
<!-- Inline commands -->
<template id="open">read</template>
<template id="exportInstructions">write</template>
<template id="exportSvg">svg</template>
<template id="exportFold">writefold</template>
<template id="exportDiagrams">writediagrams</template>
<template id="undo">undo</template>
<template id="mvCycle">mv</template>
<template id="valley">valley</template>
<template id="mountain">mountain</template>
<template id="lines">lines</template>
<template id="edges">edges</template>
<template id="snap">snap</template>
<template id="overlayCde">overlay</template>
<template id="labels">labels</template>
<template id="textures">textures</template>
<!-- Inline models -->
<template id="test">
  d 200 200
  across2d p1 p2
  across2d p0 p1
  t 1000 r s6 -160 p2 p8 p3
  t 100 fit // Todo fix animation
  by3d p1 p6
  t 1000 r s11 160 p2 a p5
  t 1000 r s11 -160 p2 a p5
</template>
<template id="cocotte">
  // Cocotte
  define 200 200
  // Define crease pattern
  c3d p0 p1 c3d p0 p3 c3d p0 p2 c3d p1 p3 c3d p0 p8 c3d p8 p3
  c3d p0 p4 c3d p4 p1 c3d p6 p0 c3d p6 p1 c3d p6 p2 c3d p6 p3
  // Movements with Accelerate Decelerate Interpolator (iad)
  iad
  t 100 ty 180
  // Fold one corner
  offset 1 F13 F14 F30 F31
  t 100 r s54 -180 p3 p17 p19
  t 100 ty 180
  // Fold from top
  t 100 rotate s27 165 p5 p22 p2
  // Lift up top right corner
  t 100 r s53 -90 p22 a p2 p18
  // Fold from right
  t 100 r s45 165 p7 p12 p1 a p2 p18
  // Flatten leg
  t 100 r s53 60 p22 a p2 p18
  // Lay leg flat
  t 100 r s53 30 p22 p2 p18
  // Lift up bottom right corner
  t 100 r s50 -90 p12 a p1 p24
  // Fold from bottom
  t 100 r s23 165 p0 p21 p4 a p1 p24
  // Flatten leg
  t 100 r s51 -60 p12 a p1 p24
  // Lay leg flat
  t 100 r s51 130 p12 p1 p24
  // Lift bottom left corner
  t 100 r s48 -90 p21 a p0 p9
  // Fold from left
  t 100 r s37 -165 p8 a p0 p9
  // Flatten leg
  t 100 r s48 -60 p9 a p0 p9
  // Lay leg flat
  t 100 r s48 -80 p21 p9 p0
  // Fold along median
  t 100 r s28 -90 p19 p5 p22 p2 p14 p15 p18 p23 p7 r s38 -90 p3
  t 100 r s28 -80 p19 p5 p22 p2 p14 p15 p18 p23 p7 a p3
  // Open front leg
  t 100 r s28 10 p9 p10 p21 p20 p8
  // Pretty
  r s50 -5 p12
  offset // Remove offset for all faces
  r s55 5 p17 a p3 r s55 -5 p19 a p3 // Beak
  a p12
  // Show
  t 100 tz -45
  iao
  t 1000 z 0.5 0 50
  t 1000 fit
  iao
  t 1000 ty 360
</template>
<template id="boat">
  // Boat
  define 210 300
  textures
  // Fold top on bottom
  across2d p1 p2
  offset -1 F0
  t 200 r s6 -180 p2 p3
  // t 200 fit
  // Crease edges at 45°
  across3d p4 p5
  bisector3d s7 s9
  bisector3d s6 s9
  // Fold corners
  offset -1 f3 f0
  t 200 rotate s13 -180 p4
  t 200 rotate s17 180 p5
  // Crease bottom and top
  by3d p9 p12
  by3d p10 p11
  // Fold back
  offset -2 F5 F6
  t 200 rotate s24 180 p3 p8 p2
  // Crease on 2D
  bisector2d s3 s24 bisector2d s23 s16
  // Fold corners
  t 200 rotate s27 -180 p3 rotate s29 180 p2
  // Fold front
  offset 2 F8 F9
  t 200 rotate s25 180 p0 p1 p7
  // Crease on 2D
  bisector2d s25 s12 bisector2d s1 s21
  // Fold corners
  t 200 rotate s31 180 p0
  t 200 rotate s33 -180 p1
  // Crease top
  by3d p15 p16
  // Open
  t 200 r s15 -180 p4 p5 p8 p14 p21 p25 p26  r s9 180 p1 p2 p11 p12 p16 p18 p19 p22
  // t 200 fit
  // Turn on left
  t 200 tz 45
  // Crease diagonal
  perpendicular3d s13 p15
  t 200 ty 45
  // Rotate triangle in front
  t 400 r s53 180 p11 p12 p1 p2
  // Rotate triangle in back
  t 400 r s53 -180 p9 p10 p0 p3
  t 200 ty -45
  t 200 fit
  // Turn on right
  t 200 tz -45
  // Close Fixme
  t 200 r s15 -180 p4 p5 p14 p8 p21 p25 p26 p32 p33 p27 p28 p30 p29  r s9 -180 p1 p2 p11 p12 p16 p18 p19 p22 p34 a p33 mop p33 p30 p29
  t 200 fit
  // Open rotate around 3
  t 1000 r s36 135 p32 p14 p33 p27 p28 p4 p5 p30 p29  r s36 -135 p31 p13 p34  a p9 p12 p0 p1 p2 p3 mop p12 p11 mop p9 p10 mop p25 p0 mop p23 p1
  t 200 fit
  // Show
  iao
  t 1000 z 0.5 0 0
  t 1000 fit
  iao
  t 1000 ty 360
</template>
</body>
</html>
