<!DOCTYPE html>
<html lang="fr">
<head>
  <title>Origami</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <meta charset="utf-8">
  <!-- sonar-disable-next-line -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    #canvas3d,#overlay{position:absolute;top:0;left:0;width:100%;height:100%}
    #canvas3d{border:1px solid black}
    #overlay{z-index:1}
    #burger,#nav,#undoBtn,#labelsBtn{position:absolute;left:8px;z-index:10;background:#f6f8fa;border:1px solid black;border-radius:6px}
    #burger{top:8px;padding:8px;line-height:0;cursor:pointer}
    #burger:hover{background:#eef1f4}
    #undoBtn{top:8px;left:54px;padding:8px;line-height:0;cursor:pointer}
    #undoBtn:hover{background:#eef1f4}
    #labelsBtn{top:8px;left:100px;padding:8px;line-height:0;cursor:pointer}
    #labelsBtn:hover{background:#eef1f4}
    #labelsBtn[aria-pressed="true"]{background:#e6a81733;border-color:#e6a817}
    #burger span{display:block;width:22px;height:2px;margin:4px 0;background:#1f2328;transition:.15s}
    #burger[aria-expanded="true"] span:first-child{transform:translateY(6px) rotate(45deg)}
    #burger[aria-expanded="true"] span:nth-child(2){opacity:0}
    #burger[aria-expanded="true"] span:last-child{transform:translateY(-6px) rotate(-45deg)}
    #nav{top:46px;display:none;min-width:180px;overflow:hidden}
    #nav button,#nav summary{display:block;width:100%;box-sizing:border-box;padding:10px 16px;color:#1f2328;background:none;border:0;font:inherit;text-align:left;white-space:nowrap;cursor:pointer}
    #nav button:hover,#nav summary:hover,#nav details[open]>summary{background:#eaedf0}
    #nav summary{list-style:none}
    #nav summary::-webkit-details-marker{display:none}
    #nav .chev{float:right;transition:transform .15s}
    #nav details[open] .chev{transform:rotate(90deg)}
    #nav details button{padding-left:32px;opacity:.85}
    #nav details details summary{padding-left:32px;opacity:.85}
    #nav details details button{padding-left:48px}
    #logPanel{position:absolute;right:8px;bottom:8px;z-index:10;width:320px;max-height:200px;display:flex;flex-direction:column;box-sizing:border-box;background:rgba(246,248,250,.92);border:1px solid black;border-radius:6px;overflow:hidden}
    #log{overflow-y:auto;padding:6px 8px;font:11px/1.4 monospace;white-space:pre-wrap;word-break:break-word;color:#1f2328}
    #log div{white-space:pre-wrap}
    #logInput{border:0;border-top:1px solid black;padding:5px 8px;font:11px monospace;background:#fff;color:#1f2328;outline:none}
  </style>
</head>
<body>
<div>
  <canvas id="canvas3d"></canvas>
</div>
<button id="burger" aria-label="Menu" aria-expanded="false">
  <span></span><span></span><span></span>
</button>
<button id="undoBtn" data-load="undo" aria-label="Undo">
  <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#1f2328" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 1 1 0 11H11"/></svg>
</button>
<button id="labelsBtn" data-load="labels" aria-label="Labels" aria-pressed="false">
  <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#1f2328" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M4 12h10"/><path d="M4 17h14"/><circle cx="18" cy="12" r="2"/></svg>
</button>
<nav id="nav">
  <details>
    <summary>Fichier<span class="chev">›</span></summary>
    <button type="button" data-load="open">Ouvrir…</button>
    <details>
      <summary>Exporter<span class="chev">›</span></summary>
      <button type="button" data-load="exportInstructions">Exporter instruction</button>
      <button type="button" data-load="exportSvg">Exporter SVG</button>
      <button type="button" data-load="exportFold">Exporter FOLD</button>
      <button type="button" data-load="exportDiagrams">Exporter diagrammes (SVG)</button>
    </details>
  </details>
  <details>
    <summary>Exemples<span class="chev">›</span></summary>
    <button type="button" data-load="cocotte">Cocotte</button>
    <button type="button" data-load="boat">Bateau</button>
    <button type="button" data-load="test">Test</button>
  </details>
</nav>
<!-- Echoes every executed command (mouse or menu); the input lets the user type one too -->
<div id="logPanel">
  <div id="log" role="log" aria-label="Command log"></div>
  <input id="logInput" type="text" placeholder="commande…" autocomplete="off" spellcheck="false">
</div>

<!-- Inlined textures -->
<img id="front" src="textures/front.jpg" style="display:none;" alt="front"/>
<img id="back" src="textures/back.jpg" style="display:none;" alt="back"/>

<!-- Main program -->
<script type="module">
  import {Model} from "./js/Model.js";
  import {View3d} from "./js/View3d.js";
  import {Command} from "./js/Command.js";
  import {Helper} from './js/Helper.js';
  init();
  function init() {
    // Model 3D
    const model = new Model().init(200, 200);

    // View 3d (creates its overlay canvas stacked on canvas3d)
    const canvas3d = document.getElementById("canvas3d");
    const view3d = new View3d(model, canvas3d);
    view3d.initBuffers();
    view3d.initPerspective();

    // Command
    const command = new Command(model, view3d);
    // Helper
    const helper = new Helper(model, command, view3d);
    helper.out();

    // Log: echoes every executed command (mouse, menu, or typed below).
    const log = document.getElementById('log');
    const MAX_LOG_LINES = 300;
    command.commandArea = {
      addLine(text) {
        const line = document.createElement('div');
        line.textContent = text;
        log.append(line);
        while (log.children.length > MAX_LOG_LINES) log.firstChild.remove();
        log.scrollTop = log.scrollHeight;
      },
      clear() {
        log.replaceChildren();
      },
    };

    // Type a command and press Enter to run it
    const logInput = document.getElementById('logInput');
    logInput.addEventListener('keydown', (event) => {
      if (event.key !== 'Enter') return;
      const text = logInput.value.trim();
      if (!text) return;
      logInput.value = '';
      command.command(text);
    });

    // Animation loop
    const labelsBtn = document.getElementById('labelsBtn');
    function loop() {
      if (command.anim()) {
        view3d.initBuffers();
        view3d.initModelView();
      }
      const pressed = String(!!model.labels);
      if (labelsBtn.getAttribute('aria-pressed') !== pressed) {
        labelsBtn.setAttribute('aria-pressed', pressed);
      }
      view3d.render();
      helper.draw();
      requestAnimationFrame(loop);
    }
    loop();

    // Add button actions
    document.querySelectorAll('button[data-load]').forEach(btn => {
      // Le lien entre data-load et dataset.load est une conversion automatique
      btn.addEventListener('click', () => load(btn.dataset.load))
    })

    // Burger toggle: open/close nav
    document.getElementById('burger').addEventListener('click', () => {
      const nav = document.getElementById('nav');
      const open = nav.style.display !== 'block';
      nav.style.display = open ? 'block' : 'none';
      document.getElementById('burger').setAttribute('aria-expanded', String(open));
    });

    // Close menu when clicking outside
    document.addEventListener('click', (e) => {
      if (!e.target.closest('#burger') && !e.target.closest('#nav')) {
        document.getElementById('nav').style.display = 'none';
        document.getElementById('burger').setAttribute('aria-expanded', 'false');
      }
    });

    // Short UI-action commands stay as inline <template> tags; origami scripts
    // live as standalone files under models/ (drop a models/<name>.txt and a
    // matching data-load button — no HTML change needed to add one).
    async function load(id) {
      const nav = document.getElementById('nav');
      nav.style.display = 'none';
      document.getElementById('burger').setAttribute('aria-expanded', 'false');
      const tpl = document.getElementById(id);
      const text = tpl
        ? /** @type {HTMLTemplateElement} */ (tpl).content.textContent
        : await fetch(`models/${id}.txt`).then(r => r.text()).catch(e => { console.error(e); return ''; });
      command.command(text);
    }

    // Chargement du modèle "test" au lancement
    load('waterbomb');
  }

</script>
<!-- Inline commands -->
<template id="open">read</template>
<template id="exportInstructions">write</template>
<template id="exportSvg">svg</template>
<template id="exportFold">writeFold</template>
<template id="exportDiagrams">diagrams</template>
<template id="undo">undo</template>
<template id="labels">labels</template>
</body>
</html>
